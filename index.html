<script>
'use strict';
/* ============================================================
   LEVEL DEVIL PAGLU — Darwaza Bhaag Gaya!
   An original troll-platformer. All code & art original.
   ============================================================ */
var W = 960, H = 540;
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');

/* ---------------- Audio (tiny WebAudio beeps) ---------------- */
var AC = null, soundOn = true;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
}
function beep(f0, f1, dur, type, vol, delay){
  if (!AC || !soundOn) return;
  try {
    var t = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t + dur);
    g.gain.setValueAtTime(vol || 0.045, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
function sfx(name){
  if (!AC || !soundOn) return;
  if (name === 'jump')  beep(300, 560, 0.12, 'square', 0.035);
  else if (name === 'death') { beep(220, 55, 0.28, 'sawtooth', 0.06); beep(140, 40, 0.3, 'triangle', 0.05, 0.02); }
  else if (name === 'key')  { beep(880, 880, 0.09, 'square', 0.05); beep(1318, 1318, 0.14, 'square', 0.05, 0.09); }
  else if (name === 'door') { beep(523,523,0.1,'square',0.05); beep(659,659,0.1,'square',0.05,0.1); beep(784,784,0.18,'square',0.05,0.2); }
  else if (name === 'locked') beep(160, 120, 0.15, 'square', 0.05);
  else if (name === 'teleport') beep(900, 200, 0.22, 'sine', 0.06);
  else if (name === 'flip') beep(200, 1200, 0.3, 'sine', 0.05);
  else if (name === 'pop') beep(500, 900, 0.07, 'square', 0.03);
  else if (name === 'boing') beep(150, 760, 0.2, 'square', 0.05);
  else if (name === 'dodge') beep(700, 1100, 0.1, 'sine', 0.04);
  else if (name === 'shot') beep(170, 55, 0.1, 'square', 0.05);
}

/* -------- Background music: tiny WebAudio chiptune loop (no files) --------
   32 eighth-note steps at ~138 BPM: cheerful C-major melody (square wave,
   kept quiet) + bouncy triangle bass. Scheduled with a small lookahead so
   it loops cleanly across screens and levels. Starts on first interaction. */
var MUS = { playing:false, step:0, nextT:0, timer:null };
var MUS_STEP = 60 / 138 / 2;
var MUS_MEL = [72,76,79,76, 81,79,76,72,  74,76,77,76, 74,72,74,76,
               72,76,79,76, 81,79,76,72,  74,76,74,72, 74,0,72,0];
var MUS_BAS = [48,55,48,55, 53,48,53,55, 48,55,48,55, 53,55,48,55];
function musNote(midi, t, dur, type, vol){
  if (!midi) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
function musTick(){
  if (!MUS.playing || !AC) return;
  while (MUS.nextT < AC.currentTime + 0.3){
    if (soundOn && !customSong){
      var s = MUS.step % 32;
      musNote(MUS_MEL[s], MUS.nextT, MUS_STEP * 0.92, 'square', 0.024);
      if (s % 2 === 0) musNote(MUS_BAS[s / 2], MUS.nextT, MUS_STEP * 1.8, 'triangle', 0.045);
    }
    MUS.nextT += MUS_STEP; MUS.step++;
  }
}
function musicStart(){
  if (customSong){ songTryPlay(); return; }   /* apna gana laga ho to synth nahi, wahi bajega */
  if (!AC || MUS.playing) return;
  MUS.playing = true; MUS.step = 0; MUS.nextT = AC.currentTime + 0.06;
  MUS.timer = setInterval(musTick, 90);
}

/* -------- Apna Gana: khud ka song background music mein --------
   Player apni audio file chunta hai; wohi loop mein bajti hai aur
   synth dhun chup ho jati hai. File IndexedDB mein save rehti hai,
   taake agli dafa isi device par khud hi lag jaye. Koi error aaye
   to feature khamoshi se band — game kabhi nahi rukta. */
var songEl = new Audio();
songEl.loop = true;
songEl.preload = 'auto';
var customSong = false;
var songURL = null;
function songTryPlay(){
  if (!customSong) return;
  songEl.muted = !soundOn;
  try { var pr = songEl.play(); if (pr && pr.catch) pr.catch(function(){}); } catch(e){}
}
function songApply(blob){
  try {
    if (songURL) URL.revokeObjectURL(songURL);
    songURL = URL.createObjectURL(blob);
    songEl.src = songURL;
    customSong = true;
    document.getElementById('btnSongX').style.display = '';
    document.getElementById('btnSong').textContent = '🎵 Gana ✓';
    songTryPlay();
  } catch(e){}
}
function songRemove(){
  try { songEl.pause(); } catch(e){}
  try { songEl.removeAttribute('src'); songEl.load(); } catch(e){}
  if (songURL){ try { URL.revokeObjectURL(songURL); } catch(e){} songURL = null; }
  customSong = false;
  document.getElementById('btnSongX').style.display = 'none';
  document.getElementById('btnSong').textContent = '🎵 Gana';
  idbDel();
  musicStart();   /* synth dhun wapas */
}
/* IndexedDB: db 'paglu', store 'songs', key 'bg' — sirf Blob save hota hai */
function idbOpen(cb){
  try {
    var rq = indexedDB.open('paglu', 1);
    rq.onupgradeneeded = function(){ try { rq.result.createObjectStore('songs'); } catch(e){} };
    rq.onsuccess = function(){ cb(rq.result); };
    rq.onerror = function(){ cb(null); };
  } catch(e){ cb(null); }
}
function idbSave(blob){
  idbOpen(function(db){
    if (!db) return;
    try { db.transaction('songs', 'readwrite').objectStore('songs').put(blob, 'bg'); } catch(e){}
  });
}
function idbLoad(){
  idbOpen(function(db){
    if (!db) return;
    try {
      var rq = db.transaction('songs', 'readonly').objectStore('songs').get('bg');
      rq.onsuccess = function(){ if (rq.result) songApply(rq.result); };
      rq.onerror = function(){};
    } catch(e){}
  });
}
function idbDel(){
  idbOpen(function(db){
    if (!db) return;
    try { db.transaction('songs', 'readwrite').objectStore('songs').delete('bg'); } catch(e){}
  });
}
var fileSong = document.getElementById('fileSong');
document.getElementById('btnSong').addEventListener('click', function(){ fileSong.click(); });
fileSong.addEventListener('change', function(){
  var f = fileSong.files && fileSong.files[0];
  fileSong.value = '';
  if (!f) return;
  idbSave(f);
  songApply(f);
});
document.getElementById('btnSongX').addEventListener('click', function(){ songRemove(); });
idbLoad();   /* pichli dafa ka gana khud dhoondh lo */

/* ---------------- Input ---------------- */
var input = { left:false, right:false, jump:false, jumpHit:false };
var KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
               Space:'jump', ArrowUp:'jump', KeyW:'jump' };
window.addEventListener('keydown', function(e){
  audioInit();
  var k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (k === 'jump' && !input.jump) input.jumpHit = true; input[k] = true; }
  if (e.code === 'Enter' || e.code === 'Space') anyPress();
  if (e.code === 'KeyR' && state === 'win') restartGame();
});
window.addEventListener('keyup', function(e){
  var k = KEYMAP[e.code];
  if (k) { e.preventDefault(); input[k] = false; }
});
cv.addEventListener('pointerdown', function(){ audioInit(); anyPress(); });
function bindBtn(id, prop){
  var el = document.getElementById(id);
  function on(e){ e.preventDefault(); audioInit(); if (prop === 'jump' && !input.jump) input.jumpHit = true; input[prop] = true; el.classList.add('on'); }
  function off(e){ e.preventDefault(); input[prop] = false; el.classList.remove('on'); }
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindBtn('tL','left'); bindBtn('tR','right'); bindBtn('tJ','jump');
document.getElementById('btnRestart').addEventListener('click', function(){
  audioInit(); if (state === 'play' || state === 'dead') startLevel(levelIdx, true);
});
document.getElementById('btnSound').addEventListener('click', function(){
  soundOn = !soundOn; this.textContent = 'Awaz: ' + (soundOn ? 'ON' : 'OFF'); if (soundOn) { audioInit(); musicStart(); sfx('key'); }
  songEl.muted = !soundOn;   /* Awaz band = apna gana bhi band */
});

/* ---------------- Helpers ---------------- */
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function overlap(a,b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function rr(x,y,w,h,r){ /* rounded rect path */
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function star(cx, cy, r){
  ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var ang = -Math.PI/2 + i * Math.PI/5, rad = (i % 2 === 0) ? r : r*0.45;
    var px = cx + Math.cos(ang)*rad, py = cy + Math.sin(ang)*rad;
    if (i === 0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

/* ---------------- Taunts ---------------- */
var TAUNTS = [
  'Wah beta wah!',
  'Itni jaldi haar maan li?',
  'Darwaza tum se darta hai!',
  'Phir mar gaye? Shocking!',
  'Kaante tumhein boht pasand hain!',
  'Ek aur try? Darwaza intezaar kar raha hai',
  'Ye maut nahi, practice hai!',
  'Level ne kaha: phir aana!',
  'Tum girte boht achay ho!',
  'Darwaza to yahin tha... chhupa hua!',
  'Chabi ne bhi bhaagna seekh liya!',
  'Painting wala darwaza kha gaya!',
  'Aag se khela, jal gaya!',
  'Goli kha li! Cover ke peeche chhupna tha!'
];

/* ---------------- Level construction ---------------- */
function P(x,y,w,h,type){ return { x:x, y:y, w:w, h:h, type:type||'solid',
  stand:0, alpha:1, state:'idle', timer:0, vy:0, stood:false, baseY:y }; }
function SPK(x, baseY, w, mode){ return { x:x, baseY:baseY, w:w, mode:mode||'static',
  maxH:26, cur:(mode==='popup'||mode==='stand'||mode==='button') ? 0 : 1, cool:0 }; }
function SAW(x,y,r,axis,from,to,speed){ return { x:x, y:y, r:r, axis:axis, from:from, to:to,
  speed:speed, dir:1, ang:0 }; }
function DOOR(x,y,kind){ return { x:x, y:y, w:44, h:84, kind:kind||'real', homeX:x, homeY:y }; }
function FLAME(x, baseY, w, phase){ return { x:x, baseY:baseY, w:w, t:phase||0, state:'off', upK:0 }; }
function CANNON(x, y, dir, interval, offset, speed){ return { x:x, y:y, dir:dir, interval:interval,
  t:-(offset||0), speed:speed||300, flash:false, post:false, wallM:false }; }

function buildLevel(n){
  var L = { name:'', hint:'', start:{x:36,y:440}, platforms:[], spikes:[], saws:[],
            doors:[], key:null, hasKey:false, wall:null, ceiling:null, blocks:[],
            safePlat:null, gates:[], gdir:1, doorRun:null, springs:[], buttons:[],
            ceilSpikes:[], teleDoor:null, poofs:[], flames:[], cannons:[], bullets:[],
            msg:'', msgT:0 };
  if (n === 0){
    L.name = 'Pehla Dhoka';
    L.hint = 'Bas darwaze tak pohoncho. Bilkul asaan... haina?';
    L.platforms = [ P(0,500,430,40), P(430,500,120,40,'trap'), P(550,500,410,40),
                    P(250,398,120,16), P(590,372,120,16) ];
    L.spikes = [ SPK(640,500,44,'popup'), SPK(800,500,44,'popup') ];
    L.doors = [ DOOR(886,416) ];
  }
  else if (n === 1){
    L.name = 'Chabi Aur Seedhi';
    L.hint = 'Chabi upar hai. Aur seedhi pe zyada bharosa mat karna!';
    L.platforms = [ P(0,500,240,40), P(240,524,720,16),
      P(262,428,72,14,'step'), P(352,376,72,14,'step'), P(442,324,72,14,'step'), P(532,272,72,14,'step'),
      P(596,232,190,18),
      P(800,292,92,16,'fade'), P(852,372,92,16,'fade'),
      P(856,448,104,16) ];
    L.spikes = [ SPK(268,524,650,'static') ];
    L.key = { x:676, y:196, taken:false, bob:0 };
    var d = DOOR(888,364); d.locked = true; L.doors = [ d ];
  }
  else if (n === 2){
    L.name = 'Teen Darwaze';
    L.hint = 'Teen darwaze hain! Suna hai asli darwaze par chhota sitara hota hai.';
    L.platforms = [ P(0,500,960,40), P(392,352,190,18,'safe'),
                    P(636,456,96,14), P(712,414,96,14), P(700,368,260,18) ];
    L.safePlat = L.platforms[1];
    L.spikes = [ SPK(414,352,148,'stand') ];
    L.saws = [ SAW(170,474,23,'x',170,590,135) ];
    L.doors = [ DOOR(716,284,'eat'), DOOR(798,284,'teleport'), DOOR(880,284,'real') ];
  }
  else if (n === 3){
    L.name = 'Dhakka Aur Chhat';
    L.hint = 'Deewar dhakka degi, chhat giregi, blocks ghumenge. Sambhal ke!';
    L.platforms = [ P(0,500,960,40),
      P(210,352,120,16), P(430,292,120,16), P(668,352,120,16),
      P(742,446,72,14), P(852,392,108,16) ];
    L.spikes = [ SPK(806,500,64,'static') ];
    L.wall = { x:110, y:372, w:34, h:128, from:110, to:520, speed:62, state:'move', timer:0 };
    L.ceiling = { x:556, y:96, w:100, h:22, spikeH:16, homeY:96, dropY:462,
                  triggerX:540, state:'idle', timer:0, vy:0 };
    L.blocks = [
      { x:250, y:452, w:48, h:48, from:225, to:400, speed:72, dir:1 },
      { x:470, y:452, w:48, h:48, from:430, to:565, speed:56, dir:-1 }
    ];
    L.doors = [ DOOR(884,308) ];
    L.start = { x:24, y:440 };
  }
  else if (n === 4){
    L.name = 'Sab Kuch Ulta';
    L.hint = 'Aakhri level! Yahan gravity bhi tum se khafa hai. Darwaza to hai hi bhaagta hua.';
    L.platforms = [ P(0,500,430,40), P(448,392,96,16),
      P(548,0,412,34),                       /* ceiling slab (floor when flipped) */
      P(606,118,104,16), P(756,158,104,16), P(872,108,104,16),  /* hanging platforms */
      P(690,500,270,40) ];                   /* final ground */
    L.spikes = [ SPK(170,500,44,'popup'), SPK(310,500,44,'popup') ];
    L.saws = [ SAW(120,474,21,'x',120,380,150) ];
    L.gates = [ { x1:548, x2:574, to:-1, label:'GRAVITY ULTA!' },
                { x1:902, x2:928, to: 1, label:'Gravity seedhi!' } ];
    var rd = DOOR(902,416,'real');
    L.doors = [ rd ];
    L.doorRun = { door:rd, spots:[812,738,700], idx:0, cool:0, done:false };
    L.start = { x:30, y:440 };
  }
  else if (n === 5){
    L.name = 'Chhupa Darwaza';
    L.hint = 'Jo darwaza dikh raha hai wo jhoot hai. Asli kahin chhupa hai — chamak dhundo!';
    L.platforms = [ P(0,500,960,40),
      P(210,392,110,16), P(560,372,110,16), P(360,268,120,16) ];
    L.spikes = [ SPK(300,500,44,'popup'), SPK(640,500,44,'popup') ];
    L.saws = [ SAW(770,474,21,'x',730,830,105) ];
    var hd6 = DOOR(452,416,'real'); hd6.hidden = true; hd6.reveal = 0;
    var bd6 = DOOR(886,416,'eat'); bd6.fakeLook = true;
    bd6.taunt = 'Ye to sirf painting thi! Asli darwaza chhupa hai!';
    L.doors = [ hd6, bd6 ];
  }
  else if (n === 6){
    L.name = 'Bhaagti Chabi';
    L.hint = 'Chabi bhi bhaagti hai, darwaza bhi gayab hota hai. Button se bach ke!';
    L.platforms = [ P(0,500,430,40), P(520,500,440,40),
      P(520,410,70,14), P(560,330,220,18) ];
    var bs1 = SPK(318,500,50,'button'), bs2 = SPK(374,500,50,'button');
    L.spikes = [ bs1, bs2, SPK(600,500,44,'popup') ];
    L.buttons = [ { x:246, y:490, w:34, h:10, fired:false, link:[bs1, bs2] } ];
    L.springs = [ { x:660, y:488, w:38, h:12, power:1150, squash:0 } ];
    L.key = { x:600, y:294, taken:false, bob:0, spots:[600,668,736], idx:0, cool:0 };
    var td7 = DOOR(886,416,'real'); td7.locked = true;
    L.doors = [ td7 ];
    L.teleDoor = { door:td7, idx:0, cool:0, done:false,
      spots:[ {x:886,y:416}, {x:580,y:246}, {x:120,y:416}, {x:886,y:416} ] };
  }
  else if (n === 7){
    L.name = 'Darwaza Mela';
    L.hint = 'Darwazon ka mela, spring ka jhoola, aakhir mein ulta gravity. Asli darwaza upar hai — sitara dhundo!';
    L.platforms = [ P(0,500,560,40),
      P(600,392,110,16), P(716,392,110,16),
      P(700,0,260,34) ];                     /* ceiling slab (floor when flipped) */
    L.spikes = [ SPK(180,500,44,'popup') ];
    L.ceilSpikes = [ { x:82, y:104, w:110, h:26 } ];
    L.springs = [ { x:118, y:488, w:38, h:12, power:1300, squash:0 },   /* trap spring */
                  { x:520, y:488, w:38, h:12, power:1150, squash:0 } ]; /* fair spring */
    L.doors = [ DOOR(240,416,'eat'), DOOR(318,416,'teleport'),
                DOOR(396,416,'teleport'), DOOR(474,416,'eat') ];
    var fd8 = DOOR(890,34,'real'); fd8.star = true;   /* hangs from the ceiling slab */
    L.doors.push(fd8);
    L.gates = [ { x1:742, x2:768, to:-1, label:'GRAVITY ULTA!' } ];
  }
  else if (n === 8){
    L.name = 'Aag Aur Goliyan';
    L.hint = 'Aag ke sholay, goliyon ki baarish, aur seedhi ke upar darwaza. Timing hi zindagi hai!';
    L.platforms = [ P(0,500,960,40),
      P(330,446,54,54),                    /* cover block: goliyon se bachao, upar bhi khade ho sakte ho */
      P(654,446,76,14),                    /* seedhi: solid, solid, ghayab wali, solid */
      P(724,392,76,14),
      P(790,338,76,14,'step'),             /* troll: ye seedhi pair rakhne ke baad gayab hoti hai */
      P(738,284,76,14),
      P(820,230,140,18) ];                 /* upar wala plateau — darwaza yahin hai */
    L.spikes = [ SPK(512,500,44,'popup') ];
    L.flames = [ FLAME(236,500,46,0), FLAME(440,500,46,0.8), FLAME(606,500,46,1.6) ];
    var cn1 = CANNON(700,470,-1,2.3,1.4,320); cn1.post = true;   /* zameen wali goli-bandi */
    var cn2 = CANNON(16,366,1,3.1,0.9,290);  cn2.wallM = true;    /* seedhi wali goli-bandi */
    L.cannons = [ cn1, cn2 ];
    L.doors = [ DOOR(892,146) ];
  }
  return L;
}
var LEVEL_COUNT = 9;

/* ---------------- Game state ---------------- */
var state = 'title';           /* title | intro | play | dead | clear | win */
var levelIdx = 0, L = null;
var deaths = 0;
var stateT = 0;                /* time in current state */
var taunt = '', banner = '', bannerT = 0;
var shake = 0, flash = 0;
var timeNow = 0;
var player = null;

function newPlayer(L){
  return { x:L.start.x, y:L.start.y, w:30, h:34, vx:0, vy:0,
           grounded:false, coyote:0, jumpBuf:0, jumpCut:false, face:1,
           standingOn:null, dead:false, squash:0 };
}
function startLevel(i, keepDeaths){
  levelIdx = i;
  L = buildLevel(i);
  player = newPlayer(L);
  state = 'intro'; stateT = 0;
  banner = ''; bannerT = 0; shake = 0; flash = 0;
  document.getElementById('hudLevel').textContent = (i+1) + ' / ' + LEVEL_COUNT + ' — ' + L.name;
}
function restartGame(){ deaths = 0; syncHud(); startLevel(0, true); }
function syncHud(){ document.getElementById('hudDeaths').textContent = deaths; }
function showBanner(txt, dur){ banner = txt; bannerT = dur || 1.6; }
function anyPress(){
  musicStart();
  if (state === 'title') startLevel(0, true);
  else if (state === 'win') restartGame();
}

function die(specialTaunt){
  if (state !== 'play') return;
  deaths++; syncHud();
  taunt = specialTaunt || TAUNTS[Math.floor(Math.random()*TAUNTS.length)];
  sfx('death');
  shake = 9; flash = 0.35;
  state = 'dead'; stateT = 0;
}
function levelClear(){
  sfx('door');
  state = 'clear'; stateT = 0;
}

/* ---------------- Physics constants ---------------- */
var GRAV = 2100, SPEED = 272, JUMP = 815;

function solidsList(){
  var out = [];
  for (var i = 0; i < L.platforms.length; i++){
    var p = L.platforms[i];
    if (p.type === 'gone') continue;
    if (p.type === 'fade' && p.alpha < 0.35) continue;
    if (p.type === 'step' && p.state === 'gone') continue;
    if (p.type === 'trap' && p.state === 'falling') continue;
    out.push(p);
  }
  if (L.ceiling && L.ceiling.state === 'wait')
    out.push({ x:L.ceiling.x, y:L.ceiling.y, w:L.ceiling.w, h:L.ceiling.h, type:'solid' });
  if (L.wall) out.push(L.wall);
  for (var j = 0; j < L.blocks.length; j++) out.push(L.blocks[j]);
  return out;
}

function spikeHazard(s){
  var hgt = s.cur * s.maxH;
  if (hgt < 11) return null;
  return { x:s.x + 4, y:s.baseY - hgt + 9, w:s.w - 8, h:hgt - 5 };
}

/* ---------------- Per-frame update ---------------- */
function update(dt){
  timeNow += dt;
  stateT += dt;
  if (bannerT > 0) bannerT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt*22);
  if (flash > 0) flash = Math.max(0, flash - dt*1.4);

  if (state === 'intro'){ if (stateT > 1.25) { state = 'play'; stateT = 0; } return; }
  if (state === 'dead'){ if (stateT > 0.62) startLevel(levelIdx, true), state = 'play', stateT = 0; return; }
  if (state === 'clear'){
    if (stateT > 1.0){
      if (levelIdx + 1 >= LEVEL_COUNT) { state = 'win'; stateT = 0; }
      else startLevel(levelIdx + 1, true);
    }
    return;
  }
  if (state !== 'play') return;

  var gdir = L.gdir;

  /* --- dynamic platforms --- */
  var i, p;
  for (i = 0; i < L.platforms.length; i++){
    p = L.platforms[i];
    if (p.type === 'fade'){
      if (player.standingOn === p){ p.stand += dt; } else p.stand = Math.max(0, p.stand - dt*2);
      if (p.stand > 0.6) p.alpha = Math.max(0, p.alpha - dt*4);
      else if (player.standingOn !== p) p.alpha = Math.min(1, p.alpha + dt*1.2);
    }
    else if (p.type === 'step'){
      if (player.standingOn === p) p.stood = true;
      else if (p.stood && p.state === 'idle'){ p.state = 'shaking'; p.timer = 0.4; }
      if (p.state === 'shaking'){ p.timer -= dt; if (p.timer <= 0){ p.state = 'gone'; p.timer = 2.2; } }
      else if (p.state === 'gone'){ p.timer -= dt; if (p.timer <= 0){ p.state = 'idle'; p.stood = false; p.alpha = 1; } }
      p.alpha = (p.state === 'gone') ? 0 : 1;
    }
    else if (p.type === 'trap'){
      if (player.standingOn === p && p.state === 'idle'){ p.stand += dt; if (p.stand > 0.32){ p.state = 'falling'; p.vy = 60; sfx('pop'); } }
      if (p.state === 'falling'){ p.vy += GRAV*dt; p.y += p.vy*dt; }
    }
    else if (p.type === 'safe'){
      /* its spikes are driven by standing — see spike update */
    }
  }

  /* --- moving wall --- */
  if (L.wall){
    var wl = L.wall;
    if (wl.state === 'move'){
      wl.x += wl.speed * dt;
      if (wl.x >= wl.to){ wl.state = 'pause'; wl.timer = 0.7; }
    } else if (wl.state === 'pause'){
      wl.timer -= dt;
      if (wl.timer <= 0){ wl.x = wl.from; wl.state = 'move'; }
    }
  }

  /* --- falling ceiling --- */
  if (L.ceiling){
    var c = L.ceiling;
    if (c.state === 'idle' && player.x + player.w > c.triggerX && player.y > 300){ c.state = 'falling'; c.vy = 0; }
    else if (c.state === 'falling'){
      c.vy += 3200*dt; c.y += c.vy*dt;
      if (c.y >= c.dropY){ c.y = c.dropY; c.state = 'wait'; c.timer = 0.75; shake = Math.max(shake, 4); }
    }
    else if (c.state === 'wait'){ c.timer -= dt; if (c.timer <= 0) c.state = 'rising'; }
    else if (c.state === 'rising'){ c.y -= 130*dt; if (c.y <= c.homeY){ c.y = c.homeY; c.state = 'idle'; } }
  }

  /* --- sliding spike blocks --- */
  for (i = 0; i < L.blocks.length; i++){
    var b = L.blocks[i];
    b.x += b.speed * b.dir * dt;
    if (b.x > b.to){ b.x = b.to; b.dir = -1; }
    if (b.x < b.from){ b.x = b.from; b.dir = 1; }
  }

  /* --- saws --- */
  for (i = 0; i < L.saws.length; i++){
    var s = L.saws[i];
    s.ang += dt * 9;
    if (s.axis === 'x'){ s.x += s.speed * s.dir * dt; if (s.x > s.to){ s.x = s.to; s.dir = -1; } if (s.x < s.from){ s.x = s.from; s.dir = 1; } }
    else { s.y += s.speed * s.dir * dt; if (s.y > s.to){ s.y = s.to; s.dir = -1; } if (s.y < s.from){ s.y = s.from; s.dir = 1; } }
  }

  /* --- fire jets: cycle 2.4s = chup 1.2s -> ember warning 0.4s -> sholay 0.8s --- */
  for (i = 0; i < L.flames.length; i++){
    var fj = L.flames[i];
    fj.t += dt;
    var fcyc = fj.t % 2.4;
    var fstate = fcyc < 1.2 ? 'off' : (fcyc < 1.6 ? 'warn' : 'up');
    if (fstate === 'up' && fj.state !== 'up' && Math.abs(player.x - fj.x) < 320) sfx('pop');
    fj.state = fstate;
    fj.upK = (fstate === 'up') ? Math.min(1, fj.upK + dt * 13) : 0;
  }

  /* --- cannons: waqt par goli, us se pehle muzzle par chamak (fair warning) --- */
  for (i = 0; i < L.cannons.length; i++){
    var cn = L.cannons[i];
    cn.t += dt;
    cn.flash = cn.t >= cn.interval - 0.25 && cn.t < cn.interval;
    if (cn.t >= cn.interval){
      cn.t = 0;
      L.bullets.push({ x: cn.x + cn.dir * 34, y: cn.y, dir: cn.dir, speed: cn.speed });
      sfx('shot');
    }
  }

  /* --- spikes --- */
  for (i = 0; i < L.spikes.length; i++){
    var sp = L.spikes[i];
    if (sp.mode === 'popup'){
      var pcx = sp.x + sp.w/2, plcx = player.x + player.w/2;
      var near = Math.abs(pcx - plcx) < 95 && Math.abs((player.y + player.h) - sp.baseY) < 95;
      if (near){ if (sp.cur === 0) sfx('pop'); sp.cur = Math.min(1, sp.cur + dt*6); }
      else sp.cur = Math.max(0, sp.cur - dt*2.2);
    }
    else if (sp.mode === 'stand'){
      var onSafe = (player.standingOn === L.safePlat);
      if (onSafe){ sp.cool += dt; if (sp.cool > 0.22){ if (sp.cur === 0) sfx('pop'); sp.cur = Math.min(1, sp.cur + dt*7); } }
      else { sp.cool = 0; sp.cur = Math.max(0, sp.cur - dt*3); }
    }
    else if (sp.mode === 'button'){
      if (sp.armed) sp.cur = Math.min(1, sp.cur + dt*5);
    }
  }

  /* --- key --- */
  if (L.key && !L.key.taken){
    L.key.bob = Math.sin(timeNow*3.2) * 4;
    /* runaway key: qareeb aane par do dafa side par bhaagti hai, phir thak jati hai */
    var kk = L.key;
    if (kk.spots){
      if (kk.cool > 0) kk.cool -= dt;
      var kdx = Math.abs(kk.x - (player.x + player.w/2));
      var kdy = Math.abs(kk.y - (player.y + player.h/2));
      if (kdx < 58 && kdy < 64 && kk.cool <= 0 && kk.idx < kk.spots.length - 1){
        kk.idx++; kk.x = kk.spots[kk.idx]; kk.cool = 0.55; sfx('dodge');
        showBanner(kk.idx >= kk.spots.length - 1 ? 'Chabi thak gayi! Pakad lo!' : 'Chabi bhi bhaag gayi!', 1.0);
      }
    }
    if (overlap(player, { x:L.key.x-6, y:L.key.y-6, w:34, h:34 })){
      L.key.taken = true; L.hasKey = true; sfx('key'); showBanner('Chabi mil gayi! Ab darwaza khulega!', 1.8);
    }
  }

  /* --- gravity gates --- */
  for (i = 0; i < L.gates.length; i++){
    var g = L.gates[i], pcx2 = player.x + player.w/2;
    if (pcx2 > g.x1 && pcx2 < g.x2 && L.gdir !== g.to){
      L.gdir = g.to; player.vy = 0; sfx('flip'); showBanner(g.label, 1.4);
    }
  }

  /* --- runaway door --- */
  if (L.doorRun && !L.doorRun.done){
    var dr = L.doorRun, dd = dr.door;
    if (dr.cool > 0) dr.cool -= dt;
    var dcx = dd.x + dd.w/2, pccx = player.x + player.w/2;
    if (Math.abs(dcx - pccx) < 115 && Math.abs(player.y - dd.y) < 90 && dr.idx < dr.spots.length && dr.cool <= 0){
      dd.x = dr.spots[dr.idx]; dr.idx++; dr.cool = 0.5; sfx('dodge');
      if (dr.idx >= dr.spots.length){ dr.done = true; showBanner('Darwaza: Thak gaya... aa jao!', 1.8); }
      else showBanner('Darwaza bhaag gaya!', 0.9);
    }
  }

  /* --- teleporting door: qareeb aane par agli jagah gayab, 3 dafa ke baad ruk jata hai --- */
  if (L.teleDoor && !L.teleDoor.done){
    var td = L.teleDoor, tdr = td.door;
    if (td.cool > 0) td.cool -= dt;
    var tdx2 = Math.abs((tdr.x + tdr.w/2) - (player.x + player.w/2));
    var tdy2 = Math.abs((tdr.y + tdr.h/2) - (player.y + player.h/2));
    if (tdx2 < 62 && tdy2 < 80 && td.cool <= 0 && td.idx < td.spots.length - 1){
      L.poofs.push({ x:tdr.x + tdr.w/2, y:tdr.y + tdr.h/2, t:0 });
      td.idx++; tdr.x = td.spots[td.idx].x; tdr.y = td.spots[td.idx].y;
      L.poofs.push({ x:tdr.x + tdr.w/2, y:tdr.y + tdr.h/2, t:0 });
      td.cool = 0.7; sfx('teleport');
      if (td.idx >= td.spots.length - 1){ td.done = true; showBanner('Darwaza: ab nahi bhaagunga... pakdo!', 1.6); }
      else showBanner('Darwaza gayab! Kahin aur gaya!', 1.0);
    }
  }

  /* --- hidden doors: player qareeb aaye to ubhar aata hai --- */
  for (i = 0; i < L.doors.length; i++){
    var hd = L.doors[i];
    if (!hd.hidden) continue;
    var hdx = (player.x + player.w/2) - (hd.x + hd.w/2);
    var hdy = (player.y + player.h/2) - (hd.y + hd.h/2);
    var hdist = Math.sqrt(hdx*hdx + hdy*hdy);
    var htar = hdist < 78 ? 1 : 0;
    hd.reveal = clamp((hd.reveal || 0) + (htar ? dt*2.6 : -dt*1.6), 0, 1);
  }

  /* --- teleport poofs --- */
  for (i = L.poofs.length - 1; i >= 0; i--){ L.poofs[i].t += dt; if (L.poofs[i].t > 0.35) L.poofs.splice(i, 1); }

  /* ================= PLAYER ================= */
  var solids = solidsList();

  /* --- bullets: chalti hain, cover/deewar se takra kar khatam --- */
  for (i = L.bullets.length - 1; i >= 0; i--){
    var bl = L.bullets[i];
    bl.x += bl.dir * bl.speed * dt;
    var bdead = bl.x < -24 || bl.x > W + 24;
    if (!bdead){
      var bbox = { x: bl.x - 5, y: bl.y - 5, w: 10, h: 10 };
      for (var bsi = 0; bsi < solids.length; bsi++){ if (overlap(bbox, solids[bsi])) { bdead = true; break; } }
    }
    if (bdead) L.bullets.splice(i, 1);
  }

  /* horizontal input */
  var move = 0;
  if (input.left) move -= 1;
  if (input.right) move += 1;
  player.vx = move * SPEED;
  if (move !== 0) player.face = move;

  /* jump buffering + coyote */
  if (input.jumpHit){ player.jumpBuf = 0.12; input.jumpHit = false; }
  else player.jumpBuf = Math.max(0, player.jumpBuf - dt);
  if (player.grounded) player.coyote = 0.085; else player.coyote = Math.max(0, player.coyote - dt);

  if (player.jumpBuf > 0 && player.coyote > 0){
    player.vy = -JUMP * gdir;
    player.jumpBuf = 0; player.coyote = 0; player.jumpCut = false;
    sfx('jump');
  }
  /* variable jump height */
  if (!input.jump && !player.jumpCut && player.vy * gdir < 0){ player.vy *= 0.42; player.jumpCut = true; }

  player.vy += GRAV * gdir * dt;
  player.vy = clamp(player.vy, -1250, 1250);

  /* move X + collide */
  player.x += player.vx * dt;
  for (i = 0; i < solids.length; i++){
    var sp2 = solids[i];
    if (overlap(player, sp2)){
      if (player.vx > 0) player.x = sp2.x - player.w;
      else if (player.vx < 0) player.x = sp2.x + sp2.w;
      else { /* pushed into by a mover: eject toward nearest side */
        var dl = (player.x + player.w) - sp2.x, drt = (sp2.x + sp2.w) - player.x;
        player.x = (dl < drt) ? sp2.x - player.w : sp2.x + sp2.w;
      }
    }
  }
  player.x = clamp(player.x, 0, W - player.w);

  /* move Y + collide */
  var wasGrounded = player.grounded;
  player.grounded = false; player.standingOn = null;
  player.y += player.vy * dt;
  for (i = 0; i < solids.length; i++){
    var sp3 = solids[i];
    if (overlap(player, sp3)){
      if (player.vy * gdir > 0){ /* falling toward gravity */
        player.y = (gdir === 1) ? sp3.y - player.h : sp3.y + sp3.h;
        player.vy = 0; player.grounded = true; player.standingOn = sp3;
      } else if (player.vy * gdir < 0){ /* head bonk */
        player.y = (gdir === 1) ? sp3.y + sp3.h : sp3.y - player.h;
        player.vy = 0;
      } else { /* sideways penetration from a mover while stationary: push out along gravity-up */
        player.y = (gdir === 1) ? sp3.y - player.h : sp3.y + sp3.h;
        player.grounded = true; player.standingOn = sp3;
      }
    }
  }
  if (player.grounded && !wasGrounded) player.squash = 0.12;
  if (player.squash > 0) player.squash -= dt;

  /* --- spring pads: upar girte hi uchhaal dete hain --- */
  for (i = 0; i < L.springs.length; i++){
    var spr = L.springs[i];
    if (spr.squash > 0) spr.squash -= dt;
    if (player.vy * gdir >= -40 && overlap(player, { x:spr.x + 2, y:spr.y - 6, w:spr.w - 4, h:spr.h + 12 })){
      player.y = (gdir === 1) ? spr.y - player.h : spr.y + spr.h;
      player.vy = -spr.power * gdir;
      player.grounded = false; player.standingOn = null;
      player.jumpCut = true;   /* spring uchhaal ko jump-cut se bachao */
      spr.squash = 0.16; sfx('boing');
    }
  }

  /* --- floor buttons: dabao to aage kaante wali trap chal jati hai --- */
  for (i = 0; i < L.buttons.length; i++){
    var bt2 = L.buttons[i];
    if (!bt2.fired && overlap(player, { x:bt2.x - 2, y:bt2.y - 9, w:bt2.w + 4, h:bt2.h + 12 })){
      bt2.fired = true; sfx('pop'); showBanner('Button dab gaya! Aage kaante!', 1.3);
      for (var bi = 0; bi < bt2.link.length; bi++) bt2.link[bi].armed = true;
    }
  }

  /* wall push: if the wall now overlaps the player, shove the player along */
  if (L.wall && overlap(player, L.wall)){
    player.x = L.wall.x + L.wall.w;
    if (player.x + player.w > W) player.x = W - player.w;
  }

  /* ================= HAZARDS ================= */
  var hz;
  for (i = 0; i < L.spikes.length; i++){ hz = spikeHazard(L.spikes[i]); if (hz && overlap(player, hz)) { die(); return; } }
  if (L.ceiling && L.ceiling.state !== 'rising'){
    var chz = { x:L.ceiling.x + 3, y:L.ceiling.y + L.ceiling.h, w:L.ceiling.w - 6, h:L.ceiling.spikeH - 2 };
    if (overlap(player, chz)) { die(); return; }
  }
  for (i = 0; i < L.saws.length; i++){
    var sw = L.saws[i]; /* circle centre stored in x,y */
    var cxx = clamp(sw.x, player.x, player.x + player.w), cyy = clamp(sw.y, player.y, player.y + player.h);
    var dx = sw.x - cxx, dy = sw.y - cyy;
    if (dx*dx + dy*dy < (sw.r - 4)*(sw.r - 4)) { die(); return; }
  }
  for (i = 0; i < L.blocks.length; i++){
    var bb = L.blocks[i];
    var topHz = { x:bb.x + 2, y:bb.y - 13, w:bb.w - 4, h:15 };
    if (overlap(player, topHz)) { die('Block ke kaante! Sambhal ke!'); return; }
  }
  for (i = 0; i < L.ceilSpikes.length; i++){
    var csh = L.ceilSpikes[i];
    if (overlap(player, { x:csh.x + 4, y:csh.y + 3, w:csh.w - 8, h:csh.h - 3 })) { die('Upar ke kaante! Spring ne dhoka diya!'); return; }
  }
  for (i = 0; i < L.flames.length; i++){
    var fh = L.flames[i];
    if (fh.state === 'up' && fh.upK > 0.55){
      var fhz = { x: fh.x + 7, y: fh.baseY - 118 * fh.upK + 12, w: fh.w - 14, h: 118 * fh.upK - 6 };
      if (overlap(player, fhz)) { die('Aag ne lapait liya! Sholay gin ke cross karo!'); return; }
    }
  }
  for (i = 0; i < L.bullets.length; i++){
    var bh = L.bullets[i];
    if (overlap(player, { x: bh.x - 6, y: bh.y - 6, w: 12, h: 12 })) { die('Goli lagi! Cover ke peeche chhupna tha!'); return; }
  }
  /* fell out of the world */
  if (player.y > H + 60 || player.y < -190) { die(); return; }

  /* ================= DOORS ================= */
  for (i = 0; i < L.doors.length; i++){
    var d = L.doors[i];
    if (!overlap(player, d)) continue;
    if (d.kind === 'eat'){ die(d.taunt || 'Darwaze ne kha liya! Ye wala nakli tha!'); return; }
    if (d.kind === 'teleport'){

function drawSpikes(x, baseY, w, hgt, down){
  if (hgt < 2) return;
  var n = Math.max(2, Math.round(w / 15)), tw = w / n;
  ctx.fillStyle = '#cfd6e4';
  ctx.strokeStyle = '#7d8699'; ctx.lineWidth = 1.5;
  for (var i = 0; i < n; i++){
    var sx = x + i*tw;
    ctx.beginPath();
    if (!down){ ctx.moveTo(sx, baseY); ctx.lineTo(sx + tw/2, baseY - hgt); ctx.lineTo(sx + tw, baseY); }
    else { ctx.moveTo(sx, baseY); ctx.lineTo(sx + tw/2, baseY + hgt); ctx.lineTo(sx + tw, baseY); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff5964';
    if (!down) ctx.fillRect(sx + tw/2 - 2, baseY - hgt, 4, 5);
    else ctx.fillRect(sx + tw/2 - 2, baseY + hgt - 5, 4, 5);
    ctx.fillStyle = '#cfd6e4';
  }
}

      var gt = L.gates[gi];
      var gg = ctx.createLinearGradient(gt.x1, 0, gt.x2, 0);
      gg.addColorStop(0, 'rgba(0,245,212,0)'); gg.addColorStop(0.5, 'rgba(0,245,212,.4)'); gg.addColorStop(1, 'rgba(0,245,212,0)');
      ctx.fillStyle = gg; ctx.fillRect(gt.x1, 0, gt.x2 - gt.x1, H);
      ctx.fillStyle = '#00f5d4'; ctx.font = '900 15px Arial'; ctx.textAlign = 'center';
      ctx.fillText(L.gdir === gt.to ? '' : 'GRAVITY', (gt.x1 + gt.x2)/2, 60);
    }
    /* platforms */
    for (var i = 0; i < L.platforms.length; i++) drawPlatform(L.platforms[i]);
    /* wall */
    if (L.wall){
      var wl = L.wall;
      ctx.fillStyle = (wl.state === 'pause' && Math.floor(timeNow*8) % 2 === 0) ? '#e84118' : '#576574';
      rr(wl.x, wl.y, wl.w, wl.h, 4); ctx.fill();
      ctx.fillStyle = '#dfe6ee'; ctx.font = '900 20px Arial'; ctx.textAlign = 'center';
      for (var wy = wl.y + 30; wy < wl.y + wl.h - 8; wy += 34) ctx.fillText('>>', wl.x + wl.w/2, wy);
    }
    /* ceiling */
    if (L.ceiling){
      var c = L.ceiling;
      ctx.fillStyle = '#576574'; rr(c.x, c.y, c.w, c.h, 4); ctx.fill();
      ctx.fillStyle = '#dfe6ee'; ctx.font = '900 12px Arial'; ctx.textAlign = 'center';
      ctx.fillText('KHATRA', c.x + c.w/2, c.y + 15);
      drawSpikes(c.x + 2, c.y + c.h, c.w - 4, c.spikeH, true);
    }
    /* blocks */
    for (i = 0; i < L.blocks.length; i++){
      var b = L.blocks[i];
      ctx.fillStyle = '#6c3483'; rr(b.x, b.y, b.w, b.h, 5); ctx.fill();
      ctx.fillStyle = '#bb6bd9'; ctx.fillRect(b.x + 3, b.y + b.h - 6, b.w - 6, 3);
      drawSpikes(b.x + 2, b.y, b.w - 4, 13, false);
    }
    /* spikes */
    for (i = 0; i < L.spikes.length; i++){
      var sp = L.spikes[i];
      drawSpikes(sp.x, sp.baseY, sp.w, sp.cur * sp.maxH, false);
    }
    /* fire jets */
    for (i = 0; i < L.flames.length; i++) drawFlame(L.flames[i]);
    /* hanging ceiling-spike panels */
    for (i = 0; i < L.ceilSpikes.length; i++){
      var csp = L.ceilSpikes[i];
      ctx.fillStyle = 'rgba(59,53,115,.55)';
      ctx.fillRect(csp.x + 6, 0, 5, csp.y); ctx.fillRect(csp.x + csp.w - 11, 0, 5, csp.y);
      ctx.fillStyle = '#3b3573'; rr(csp.x - 2, csp.y - 6, csp.w + 4, 8, 3); ctx.fill();
      drawSpikes(csp.x, csp.y, csp.w, csp.h, true);
    }
    /* spring pads + floor buttons */
    for (i = 0; i < L.springs.length; i++) drawSpring(L.springs[i]);
    for (i = 0; i < L.buttons.length; i++) drawButton(L.buttons[i]);
    /* key + doors + saws */
    if (L.key) drawKey(L.key);
    for (i = 0; i < L.doors.length; i++) drawDoor(L.doors[i]);
    if (L.doorRun && L.doorRun.done){
      ctx.fillStyle = '#fff'; ctx.font = '700 14px Arial'; ctx.textAlign = 'center';
      ctx.fillText('Thak gaya...', L.doorRun.door.x + 22, L.doorRun.door.y - 34);
      ctx.font = '12px Arial'; ctx.fillText('aa jao, nahi bhaagunga', L.doorRun.door.x + 22, L.doorRun.door.y - 16);
    }
    for (i = 0; i < L.saws.length; i++) drawSaw(L.saws[i]);
    /* teleport poofs */
    for (i = 0; i < L.poofs.length; i++){
      var pf = L.poofs[i];
      ctx.strokeStyle = 'rgba(187,107,217,' + (0.55 * (1 - pf.t / 0.35)) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pf.x, pf.y, 8 + pf.t * 52, 0, 7); ctx.stroke();
    }
    /* cannons + bullets */
    for (i = 0; i < L.cannons.length; i++) drawCannon(L.cannons[i]);
    for (i = 0; i < L.bullets.length; i++) drawBullet(L.bullets[i]);
    /* player */
    if (state !== 'dead') drawPlayer();
    else { /* ghost poof on death */
      ctx.fillStyle = 'rgba(205,205,225,.5)';
      ctx.beginPath(); ctx.arc(player.x + 15, player.y + 17, 20 + stateT*26, 0, 7); ctx.fill();
    }
    /* level tag */
    ctx.fillStyle = 'rgba(232,232,255,.75)'; ctx.font = '700 15px Arial'; ctx.textAlign = 'left';
    ctx.fillText('Level ' + (levelIdx + 1) + ': ' + L.name, 14, 26);
    if (L.gdir === -1){ ctx.fillStyle = '#00f5d4'; ctx.textAlign = 'right'; ctx.fillText('GRAVITY ULTA!', W - 14, 26); }

    /* intro card */
    if (state === 'intro'){
      ctx.fillStyle = 'rgba(10,10,24,.72)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd32a'; ctx.font = '900 52px Arial';
      ctx.fillText('LEVEL ' + (levelIdx + 1), W/2, 226);
      ctx.fillStyle = '#fff'; ctx.font = '900 30px Arial';
      ctx.fillText(L.name, W/2, 272);
      ctx.fillStyle = '#c9c9ee'; ctx.font = '19px Arial';
      ctx.fillText(L.hint, W/2, 316);
    }
    /* clear card */
    if (state === 'clear'){
      ctx.fillStyle = 'rgba(10,24,10,.55)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#7bf1a8'; ctx.font = '900 46px Arial';
      ctx.fillText('LEVEL CLEAR!', W/2, 262);
    }
    /* banner */
    if (bannerT > 0 && banner){
      ctx.textAlign = 'center'; ctx.font = '900 24px Arial';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.65)';
      ctx.strokeText(banner, W/2, 74);
      ctx.fillStyle = '#ffe66d'; ctx.fillText(banner, W/2, 74);
    }
    /* death taunt */
    if (state === 'dead'){
      ctx.textAlign = 'center'; ctx.font = '900 40px Arial';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.strokeText(taunt, W/2, 168);
      ctx.fillStyle = '#ff5964'; ctx.fillText(taunt, W/2, 168);
      ctx.font = '700 20px Arial'; ctx.fillStyle = '#fff';
      ctx.fillText('Maut (Deaths): ' + deaths, W/2, 204);
    }
  }
  if (state === 'win'){
    ctx.fillStyle = 'rgba(10,10,24,.8)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd32a'; ctx.font = '900 56px Arial';
    ctx.fillText('TUM JEET GAYE!', W/2, 200);
    ctx.fillStyle = '#fff'; ctx.font = '24px Arial';
    ctx.fillText('Darwaza akhir pakda gaya!', W/2, 252);
    ctx.fillText('Total Maut (Deaths): ' + deaths, W/2, 296);
    ctx.fillStyle = '#7bf1a8'; ctx.font = '20px Arial';
    ctx.fillText(deaths <= 12 ? 'Wah! Tum to pro nikle!' : (deaths <= 30 ? 'Boht khoob! Darwaza ab bhi kaanp raha hai.' : 'Jeet to gaye... ' + deaths + ' dafa mar ke! Legend!'), W/2, 340);
    ctx.fillStyle = '#8f7bff'; ctx.font = '700 21px Arial';
    if (Math.floor(timeNow*1.6) % 2 === 0) ctx.fillText('Phir se khelo — R dabao ya tap karo', W/2, 404);
  }
  ctx.restore();
  if (flash > 0){ ctx.fillStyle = 'rgba(255,40,60,' + (flash*0.5) + ')'; ctx.fillRect(0, 0, W, H); }
}

/* ---------------- Main loop ---------------- */
var lastT = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = Math.min(0.033, (ts - lastT) / 1000 || 0.016);
  lastT = ts;
  update(dt);
  draw();
}
requestAnimationFrame(frame);

/* Dev/QA hook: ?go=1&level=N jumps straight into a level */
(function(){
  try {
    var q = new URLSearchParams(window.location.search);
    if (q.get('go') === '1'){
      var lv = parseInt(q.get('level') || '1', 10);
      if (isNaN(lv)) lv = 1;
      startLevel(clamp(lv - 1, 0, LEVEL_COUNT - 1), true);
      state = 'play'; stateT = 0;
    }
  } catch(e){}
})();
</script>
